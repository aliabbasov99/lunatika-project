</script><script>
  (() => {
    const routes = new Set(['/data', '/chat', '/simulation', '/mission-explorer', '/applications']);
    document.addEventListener('click', (event) => {
      const link = event.target instanceof Element ? event.target.closest('a') : null;
      if (!link) return;
      const target = link.getAttribute('href') || link.getAttribute('to');
      if (!target) return;
      const hashIndex = target.lastIndexOf('#/');
      const route = hashIndex >= 0 ? target.slice(hashIndex + 1) : target;
      if (!routes.has(route)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      window.parent.location.assign(`${window.parent.location.origin}/#${route}`);
    }, true);
  })();
