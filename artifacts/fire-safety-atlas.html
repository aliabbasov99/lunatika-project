<style id="page-css"></style>
<style>
.brand{display:none!important}

<body>
<div id="app"></div>
<template id="tpl-Main">

<div class="pg">
<div class="wrap">
<header class="nav">
<nav aria-label="Sections">
<a href="#Main" class="on" aria-current="page">Overview</a>
<a href="#Prevention">Prevention</a>
<a href="#Detection">Detection</a>
<a href="#Suppression">Suppression</a>
<a href="#Evidence">Evidence</a>
<a href="#Applications">Applications</a>
</nav>
</header>

<section style="margin-top: 52px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<div class="eyebrow">NASA Space Apps · Flame in Freefall</div>
<h1 class="hero">Fire safety in microgravity</h1>
<p class="lede">A live habitat model and evidence-based checks across NASA's three fire safety layers: prevention, detection and suppression.</p>
</div>
<span class="chip" style="border: 1px solid #2a3d56; color: #cfe9ef; font-size: 11px; letter-spacing: .06em">PROTOTYPE · EXAMPLE DATA</span>
</section>

<div style="display: flex; gap: 8px; overflow-x: auto; margin-top: 26px; padding-bottom: 4px" role="group" aria-label="Choose a mission">
<template data-sc="for" list="{{missions}}" as="m" hint-placeholder-count="4">
<button type="button" class="mb" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}"><b>{{m.n}}</b><span>{{m.s}}</span></button>
</template>
</div>

<section class="card scene" style="margin-top: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 6px 12px">
<div>
<div class="eyebrow">Live habitat model</div>
<h2 style="margin: 4px 0 0; font-size: 22px; font-weight: 700">{{sceneTitle}}</h2>
</div>
<div class="seg" role="group" aria-label="Gravity comparison">
<button type="button" aria-pressed="{{gMicro}}" onClick="{{setMicro}}">{{missionGravLabel}}</button>
<button type="button" aria-pressed="{{gEarth}}" onClick="{{setEarth}}">Earth gravity</button>
</div>
</div>

    };
    var self = this, s = this.state, sel = M[s.mission] ? s.mission : 'iss', c = M[sel];
    var missions = Object.keys(M).map(function (k) {
      return { n: M[k].n, s: M[k].s, pressed: k === sel ? 'true' : 'false', pick: function () { self.setState({ mission: k, grav: 'micro' }); } };
    });
    var g = s.grav === 'earth' ? 1 : c.g, g0 = g === 0, ventOn = s.vent === 'on';
    var orbit = sel === 'iss', mars = sel === 'mars', moon = sel === 'moon' || sel === 'rover';
    var gStr = g === 0 ? '0 g' : g + ' g';
    var d, label, msg, short, time, timeSub;
    if (s.det === 'ceiling') {
      if (g0) { d = 'bad'; label = 'FAIL'; short = 'ceiling · no signal'; msg = 'Smoke does not rise in microgravity, so the ceiling detector never sees it. Move it into the duct.'; time = 'Never'; timeSub = 'smoke does not rise in 0 g'; }
      else if (g < 1) { d = 'warn'; label = 'WATCH'; short = 'ceiling · late alarm'; msg = 'At ' + g + ' g smoke rises slowly, so a ceiling detector alarms late. Add one in the duct.'; time = '≈ ' + Math.round(4 / Math.sqrt(g)) + ' s'; timeSub = 'slow buoyant rise'; }
      else { d = 'ok'; label = 'PASS'; short = 'ceiling · alarm'; msg = 'With full gravity hot smoke rises straight to the ceiling detector.'; time = '≈ 4 s'; timeSub = 'buoyant rise'; }
    } else {

    var h = g0 ? 0 : Math.round(26 + 22 * Math.min(1, Math.sqrt(g)));
    var tearPath = 'M512,244 C490,244 486,222 496,206 C503,194 508,' + (236 - h - 14) + ' 512,' + (236 - h) + ' C516,' + (236 - h - 14) + ' 521,194 528,206 C538,222 534,244 512,244Z';
    var mm = Math.floor(s.t / 60), ss = s.t % 60;
    return {
      missions: missions, sceneTitle: c.title,
      cur: { p: c.p, o2: c.o2 }, o2frac: (c.o2 / 100).toFixed(2),
      gTxt: gStr, gSub: s.grav === 'earth' ? 'comparison view' : c.n,
      partial: c.g > 0 && c.g < 1,

      ground: (moon || mars) && sel !== 'rover', rover: sel === 'rover',

      { id: 'silicone', n: 'Silicone rubber', b: 22 },
      { id: 'nomex', n: 'Nomex fabric', b: 26 },
      { id: 'ptfe', n: 'PTFE-coated fiberglass', b: 33 }
    ];
    function lim(u, b) { return b + 9 * Math.pow(Math.max(0, 0.6 - u), 1.3) + 12 * Math.pow(Math.max(0, u - 1.1), 1.5); }
    function sev(m) { return m > 3 ? 'ok' : m >= 0 ? 'warn' : 'bad'; }
    var LAB = { ok: 'PASS', warn: 'WATCH', bad: 'FAIL' };
    var COL = { ok: '#4ade80', warn: '#fbbf24', bad: '#f87171' };
    function flowV(u) { var v = Math.pow(10, u); return v < 10 ? v.toFixed(1) : String(Math.round(v)); }
    var L = 56, T = 20, PW = 560, PH = 300, X0 = 15, X1 = 40, U0 = -0.3, U1 = 1.7;
    function xp(o) { return L + (Math.min(X1, Math.max(X0, o)) - X0) / (X1 - X0) * PW; }
    function yp(v) { return T + (1 - (v - U0) / (U1 - U0)) * PH; }
    var m = MATS.filter(function (x) { return x.id === self.state.mat; })[0];
    var pts = [];
    for (var i = 0; i <= 80; i++) { var uu = U0 + (U1 - U0) * i / 80; pts.push([xp(lim(uu, m.b)).toFixed(1), yp(uu).toFixed(1)]); }
    var curve = 'M' + pts.map(function (p) { return p.join(','); }).join(' L');
    var spread = 'M' + (L + PW) + ',' + yp(U1) + pts.slice().reverse().map(function (p) { return ' L' + p.join(','); }).join('') + ' L' + (L + PW) + ',' + yp(U0) + 'Z';
    var embers = [], seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var k = 0; k < 40 && embers.length < 16; k++) {
      var eu = U0 + 0.08 + rnd() * (U1 - U0 - 0.16), ex = L + 10 + rnd() * (PW - 20), cx = xp(lim(eu, m.b));
      if (ex > cx + 14) embers.push({ x: ex.toFixed(1), y: yp(eu).toFixed(1), r: (1.2 + rnd() * 1.8).toFixed(1), st: 'animation-delay:-' + (rnd() * 3.4).toFixed(2) + 's' });
    }
    var dieX = 64, dieAnchor = 'start';
    var lowX = xp(lim(U0, m.b));
    if (lowX < 190) { dieX = 64; }
    var qU = -0.18, bU = 1.6;
    var mg = lim(u, m.b) - O2, c = sev(mg), txt;
    if (c === 'ok') txt = m.n + ' should not sustain a flame at 21% O₂ and ' + flowV(u) + ' cm/s. Margin: ' + mg.toFixed(1) + ' points.';
    else if (c === 'warn') txt = m.n + ' is close to its limit at 21% O₂. Margin is only ' + mg.toFixed(1) + ' points, so a small airflow change could let it burn.';
    else txt = m.n + ' would keep burning at 21% O₂ and ' + flowV(u) + ' cm/s. Choose a more resistant material or adjust airflow.';
    var dotY = yp(u), boxY = dotY < 70 ? dotY + 14 : dotY - 60;
    var rank = MATS.map(function (x) { var l = lim(u, x.b); return { n: x.n, lv: l, mgv: l - O2 }; })

        return { n: r.n, l: r.lv.toFixed(1) + '%', mg: (r.mgv > 0 ? '+' : '') + r.mgv.toFixed(1), label: LAB[s], s: s, bar: bar };
      });
    return {
      mats: MATS.map(function (x) { return { n: x.n, b: x.b, pressed: x.id === m.id ? 'true' : 'false', pick: function () { self.setState({ mat: x.id }); } }; }),
      onFlow: function (e) { self.setState({ u: +e.target.value }); },
      u: u, flowTxt: flowV(u) + ' cm/s', flowShort: flowV(u) + ' cm/s',
      curve: curve, spread: spread, embers: embers,
      dieX: dieX, dieAnchor: dieAnchor,
      quenchX: (xp(lim(qU, m.b)) + 10).toFixed(1), quenchY: (yp(qU) + 4).toFixed(1),

      boxY: boxY.toFixed(1), boxT1: (boxY + 19).toFixed(1), boxT2: (boxY + 36).toFixed(1),
      boxLine: '21% O₂ · ' + flowV(u) + ' cm/s · ' + LAB[c],
      marginTxt: (mg > 0 ? '+' : '') + mg.toFixed(1),
      check: { label: LAB[c], text: txt, s: c },
      rank: rank,
      mapLabel: 'Flammability map for ' + m.n + ': the cabin at 21% oxygen and ' + flowV(u) + ' cm/s airflow is in the ' + (mg < 0 ? 'flame spreads' : 'flame dies out') + ' region, margin ' + mg.toFixed(1) + ' points'
    };
  }
}
</script>

<script type="text/plain" id="js-Detection">
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { place: 'ceiling', type: 'photo' }; }
  renderVals() {
    var self = this, s = this.state;
    var LAB = { ok: 'PASS', warn: 'WATCH', bad: 'FAIL' };
    function chk(c, t) { return { label: LAB[c], text: t, s: c }; }
    var checks = [];
    if (s.place === 'ceiling') checks.push(chk('bad', 'Smoke does not rise in microgravity. A ceiling detector only sees smoke the airflow happens to carry there. Move it into the ventilation duct.'));
    else checks.push(chk('ok', 'The detector sits in the airflow path, so ventilation carries smoke to it at any gravity level.'));
    if (s.type === 'ion') checks.push(chk('warn', 'Ionization sensors favor very small particles. Smoldering materials can make larger particles that this sensor may under-report.'));
    else if (s.type === 'multi') checks.push(chk('ok', 'Combining particle and gas sensing covers both flaming and smoldering sources.'));
    else checks.push(chk('ok', 'Light-scattering sensors respond well to the larger particles typical of smoldering and overheated materials.'));
    return {
      checks: checks,
      placeCeiling: s.place === 'ceiling', placeDuct: s.place === 'duct',
      typePhoto: s.type === 'photo', typeIon: s.type === 'ion', typeMulti: s.type === 'multi',
      onPlace: function (e) { self.setState({ place: e.target.value }); },
      onType: function (e) { self.setState({ type: e.target.value }); }
    };
  }
}
</script>

    function chk(c, t, lbl) { return { label: lbl || LAB[c], text: t, s: c }; }
    function needed(o2, k) { return k * (1 - 17 / o2) * 100; }
    var L = 44, T = 12, PW = 362, PH = 204, X0 = 18, X1 = 40, Y1 = 80;
    function xp(o) { return L + (o - X0) / (X1 - X0) * PW; }
    function yp(v) { return T + (1 - v / Y1) * PH; }
    function path(k) { var d = ''; for (var o = X0; o <= X1; o += 0.5) { var v = Math.min(Y1, needed(o, k)); d += (d ? ' L' : 'M') + xp(o).toFixed(1) + ',' + yp(v).toFixed(1); } return d; }
    var checks = [];
    if (s.agent === 'co2') checks.push(chk('ok', 'At 21% O₂, roughly ' + Math.round(needed(O2, 1.05)) + '% CO₂ in the local air is needed to stop a flame. Crew must wear masks because CO₂ builds up in a sealed cabin.'));
    else if (s.agent === 'he') checks.push(chk('warn', 'Helium needs about ' + Math.round(needed(O2, 1.6)) + '% at this oxygen level, more than CO₂. It is studied in FLEX but not used as a crew extinguisher.'));
    else checks.push(chk('warn', 'Water droplets float in microgravity and can drift into electronics. Aim carefully and plan cleanup.'));
    if (s.fan === 'on') checks.push(chk('bad', 'Running fans keep feeding oxygen to the fire and spread smoke and agent. Standard response shuts ventilation first.'));
    else checks.push(chk('ok', 'Ventilation shutdown starves the flame of fresh oxygen, as in ISS procedures.'));
    checks.push(chk('warn', 'FLEX found that some fuel droplets kept burning as invisible cool flames after the visible flame went out. Confirm extinguishment with gas sensors, not just sight.', 'NOTE'));
    var k = s.agent === 'he' ? 1.6 : 1.05;
    return {
      checks: checks,
      grid: [0, 20, 40, 60, 80].map(function (v) { return { y: yp(v), ty: yp(v) + 4, t: v + '%' }; }),
      co2Path: path(1.05), hePath: path(1.6), dotY: yp(Math.min(Y1, needed(O2, k))).toFixed(1),
      aCo2: s.agent === 'co2', aMist: s.agent === 'mist', aHe: s.agent === 'he',
      fanOff: s.fan === 'off', fanOn: s.fan === 'on',
      onAgent: function (e) { self.setState({ agent: e.target.value }); },
      onFan: function (e) { self.setState({ fan: e.target.value }); }
    };
  }
}
</script>
